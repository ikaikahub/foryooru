[package]
name = "foryooru-server"
version = "0.1.0"
edition = "2024"

[dependencies]
foryooru-core = { path = "../core" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.9"
