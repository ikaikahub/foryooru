[package]
name = "foryooru"
version = "0.1.0"
description = "A Gelbooru viewer with recommendations"
authors = ["you"]
edition = "2024"

[workspace]
members = ["core", "server"]

[lib]
name = "foryooru_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
foryooru-core = { path = "core" }
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
tokio = { version = "1", features = ["sync", "time"] }
thiserror = "2"
chrono = "0.4"
html-escape = "0.2"
md-5 = "0.10"
rand = "0.9"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
argon2 = "0.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
clipboard-rs = "0.3.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "linux")'.dependencies]
clipboard-rs = { version = "0.3.5", features = ["wayland"] }
tiny_http = "0.12"

# dependencies keep only line numbers for backtraces, which makes debug builds link much faster
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
