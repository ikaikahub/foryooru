[package]
name = "foryooru-web"
version = "0.1.0"
edition = "2024"

# Tauri sets `desktop` and `mobile` for the app; the copied modules still mention them
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(desktop)", "cfg(mobile)"] }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
foryooru-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["backup", "fallible_uint"] }
sqlite-wasm-vfs = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", default-features = false, features = ["sync"] }
thiserror = "2"
chrono = { version = "0.4", features = ["wasmbind"] }
html-escape = "0.2"
md-5 = "0.10"
rand = "0.9"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
web-time = "1"
sqlite-wasm-rs = "0.5"
console_error_panic_hook = "0.1"
