<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/dorito_circle128.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/dorito192.png" />
    <meta name="theme-color" content="#0e0f21" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Foryooru</title>
    <meta name="description" content="A booru client for doomscrolling." />
    <!-- the app is static, so every shared link gets this same preview card -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Foryooru" />
    <meta property="og:title" content="Foryooru" />
    <meta property="og:description" content="A booru client for doomscrolling." />
    <meta property="og:url" content="https://ikaikahub.github.io/foryooru/" />
    <meta property="og:image" content="https://ikaikahub.github.io/foryooru/dorito512.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="dorito" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Foryooru" />
    <meta name="twitter:description" content="A booru client for doomscrolling." />
    <meta name="twitter:image" content="https://ikaikahub.github.io/foryooru/dorito512.png" />
    <meta name="twitter:image:alt" content="Foryooru's dorito mascot" />
    <!-- the loading screen is plain HTML so it shows before any JavaScript, +layout.svelte fades it out -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #13152c;
        color: #f2f2f7;
        font: 600 1.1rem system-ui, sans-serif;
        transition: opacity 250ms ease-out;
      }
      #splash.failed .icon {
        animation: none;
        opacity: 0.5;
      }
      #splash.failed span {
        max-width: 20rem;
        text-align: center;
        font-weight: 400;
      }
      #splash.leaving {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-color-scheme: light) {
        #splash {
          background: #ffffff;
          color: #1a1a1a;
        }
      }
      #splash .icon {
        width: 6rem;
        height: 6rem;
        border-radius: 50%;
        animation: splash-pulse 900ms ease-in-out infinite alternate;
      }
      @keyframes splash-pulse {
        from { transform: scale(0.94); opacity: 0.75; }
        to { transform: scale(1); opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        #splash * { animation: none !important; }
      }
    </style>
    <!-- with scripts off nothing can remove the splash, so it explains itself instead of pulsing forever -->
    <noscript>
      <style>
        #splash > span { display: none; }
        #splash .icon { animation: none; opacity: 0.5; }
        #splash .note { display: block; max-width: 20rem; text-align: center; font-weight: 400; }
      </style>
    </noscript>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="splash">
      <img class="icon" src="%sveltekit.assets%/dorito192.png" alt="" />
      <span>Foryooru</span>
      <noscript><span class="note">Foryooru needs JavaScript to run. Enable it for this site, then reload.</span></noscript>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
